<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>訂單管理｜WUGONG 吾鋼</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: "Noto Sans TC", Arial, sans-serif;
}

header {
    padding: 28px 30px;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    font-size: 24px;
    letter-spacing: 2px;
}

header p {
    margin: 8px 0 0;
    color: #b58b55;
    font-size: 13px;
    letter-spacing: 2px;
}

main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 35px 25px;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.toolbar h2 {
    margin: 0;
    font-size: 20px;
}

button {
    background: #b58b55;
    color: #111;
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: 0.85;
}

.table-wrap {
    overflow-x: auto;
    border: 1px solid #333;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
}

th {
    background: #1b1b1b;
    color: #c9a56a;
    text-align: left;
    padding: 14px;
    border-bottom: 1px solid #444;
    white-space: nowrap;
}

td {
    padding: 14px;
    border-bottom: 1px solid #292929;
    vertical-align: top;
}

tr:hover {
    background: #181818;
}

.order-number {
    color: #c9a56a;
}

.status {
    display: inline-block;
    padding: 5px 10px;
    border: 1px solid #80683f;
    color: #d8b777;
    white-space: nowrap;
}

.empty,
.loading {
    text-align: center;
    padding: 50px;
    color: #888;
}

.error {
    color: #e28b8b;
    text-align: center;
    padding: 40px;
}

.items {
    min-width: 230px;
    line-height: 1.7;
}

@media (max-width: 700px) {
    header {
        padding: 22px 18px;
    }

    main {
        padding: 25px 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>吾鋼 WUGONG</h1>
    <p>ORDER MANAGEMENT</p>
</header>

<main>

<div class="toolbar">
    <h2>訂單管理</h2>
    <button onclick="loadOrders()">重新整理</button>
</div>

<div class="table-wrap">

<table>
<thead>
<tr>
    <th>訂單編號</th>
    <th>客戶</th>
    <th>聯絡方式</th>
    <th>商品</th>
    <th>金額</th>
    <th>付款</th>
    <th>配送</th>
    <th>狀態</th>
    <th>下單時間</th>
</tr>
</thead>

<tbody id="orders">
<tr>
    <td colspan="9" class="loading">正在讀取訂單...</td>
</tr>
</tbody>

</table>

</div>

</main>

<script>

function money(value) {
    return "NT$ " + Number(value || 0).toLocaleString("zh-TW");
}

function formatDate(value) {
    if (!value) return "";
    const date = new Date(value);
    return date.toLocaleString("zh-TW");
}

function renderItems(items) {

    if (!items) return "";

    try {
        if (typeof items === "string") {
            items = JSON.parse(items);
        }

        return items.map(item => {

            const name =
                item.product ||
                item.name ||
                "商品";

            const nib =
                item.nib
                ? "<br>筆尖：" + item.nib
                : "";

            const quantity =
                item.quantity || 1;

            return `
                <div>
                    ${name}
                    ${nib}
                    <br>數量：${quantity}
                </div>
            `;

        }).join("<hr style='border:0;border-top:1px solid #333;'>");

    } catch (error) {
        return items;
    }
}
async function updateStatus(orderNumber, status) {
    try {
        const response = await fetch("/api/order/status", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                orderNumber: orderNumber,
                status: status
            })
        });

        const result = await response.json();

        if (!result.success) {
            alert("更新失敗：" + (result.error || "未知錯誤"));
            loadOrders();
            return;
        }

        alert("訂單狀態已更新");
        loadOrders();

    } catch (error) {
        alert("更新失敗，請稍後再試");
        loadOrders();
    }
}
async function loadOrders() {

    const tbody =
        document.getElementById("orders");

    tbody.innerHTML =
        `<tr>
            <td colspan="9" class="loading">
                正在讀取訂單...
            </td>
        </tr>`;

    try {

        const response =
            await fetch("/api/orders");

        const result =
            await response.json();

        if (!result.success) {
            throw new Error(
                result.error || "讀取訂單失敗"
            );
        }

        const orders =
            result.orders || [];

        if (orders.length === 0) {

            tbody.innerHTML =
                `<tr>
                    <td colspan="9" class="empty">
                        目前沒有訂單
                    </td>
                </tr>`;

            return;
        }

        tbody.innerHTML =
            orders.map(order => `

                <tr>

                    <td class="order-number">
                        ${order.order_number || ""}
                    </td>

                    <td>
                        ${order.customer_name || ""}
                    </td>

                    <td>
                        ${order.phone || ""}
                        <br>
                        ${order.email || ""}
                    </td>

                    <td class="items">
                        ${renderItems(order.items)}
                    </td>

                    <td>
                        ${money(order.total)}
                    </td>

                    <td>
                        ${order.payment || ""}
                    </td>

                    <td>
                        ${order.shipping || ""}
                    </td>

                    <td>
  <select class="status" onchange="updateStatus('${order.order_number}', this.value)">
    <option value="pending" ${order.status === "pending" ? "selected" : ""}>待處理</option>
    <option value="confirmed" ${order.status === "confirmed" ? "selected" : ""}>已確認</option>
    <option value="paid" ${order.status === "paid" ? "selected" : ""}>已付款</option>
    <option value="shipped" ${order.status === "shipped" ? "selected" : ""}>已出貨</option>
    <option value="completed" ${order.status === "completed" ? "selected" : ""}>已完成</option>
    <option value="cancelled" ${order.status === "cancelled" ? "selected" : ""}>已取消</option>
</select>
                    </td>

                    <td>
                        ${formatDate(order.created_at)}
                    </td>

                </tr>

            `).join("");

    } catch (error) {

        tbody.innerHTML =
            `<tr>
                <td colspan="9" class="error">
                    無法讀取訂單：${error.message}
                </td>
            </tr>`;
    }
}

loadOrders();

</script>

</body>
</html>
