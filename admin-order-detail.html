<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>訂單詳細資料｜WUGONG 吾鋼</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: "Noto Sans TC", Arial, sans-serif;
    }

    header {
      padding: 28px 30px;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      color: #d6a75d;
      font-size: 26px;
    }

    header p {
      margin: 8px 0 0;
      color: #888;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 25px;
      padding: 10px 18px;
      background: #222;
      color: #eee;
      border: 1px solid #555;
      text-decoration: none;
      cursor: pointer;
    }

    .order-card {
      background: #181818;
      border: 1px solid #333;
      padding: 30px;
      border-radius: 8px;
    }

    .order-number {
      font-size: 20px;
      color: #d6a75d;
      margin-bottom: 25px;
    }

    .section {
      border-top: 1px solid #333;
      padding: 22px 0;
    }

    .section:first-of-type {
      border-top: none;
    }

    .section h2 {
      font-size: 17px;
      color: #d6a75d;
      margin: 0 0 15px;
    }

    .row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 10px;
      margin: 10px 0;
      line-height: 1.6;
    }

    .label {
      color: #999;
    }

    .items {
      line-height: 1.8;
    }

    .total {
      font-size: 22px;
      color: #d6a75d;
      font-weight: bold;
    }

    .loading,
    .error {
      text-align: center;
      padding: 50px 20px;
      color: #aaa;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .order-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>WUGONG 吾鋼｜訂單詳細資料</h1>
  <p>ORDER DETAILS</p>
</header>

<main>

  <a href="admin-orders.html" class="back-btn">
    ← 返回訂單管理
  </a>

  <div id="content" class="order-card">
    <div class="loading">正在讀取訂單資料...</div>
  </div>

</main>

<script>

function money(value) {
  return "NT$ " + Number(value || 0).toLocaleString("zh-TW");
}

function formatDate(value) {
  if (!value) return "";

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleString("zh-TW");
}

function renderItems(items) {

  if (!items) return "";

  try {
    if (typeof items === "string") {
      items = JSON.parse(items);
    }

    return items.map(item => {

      const name =
        item.product ||
        item.name ||
        "商品";

      const nib =
        item.nib
          ? "<br>筆尖：" + item.nib
          : "";

      const qty =
        item.quantity ||
        item.qty ||
        1;

      return `
        <div style="margin-bottom:15px;">
          ${name}
          ${nib}
          <br>
          數量：${qty}
        </div>
      `;

    }).join("");

  } catch (error) {
    return String(items);
  }
}

async function loadOrderDetail() {

  const content =
    document.getElementById("content");

  const params =
    new URLSearchParams(window.location.search);

  const orderNumber =
    params.get("order");

  if (!orderNumber) {
    content.innerHTML =
      '<div class="error">找不到訂單編號</div>';
    return;
  }

  try {

    const response =
      await fetch("/api/orders");

    const result =
      await response.json();

    if (!result.success) {
      throw new Error(
        result.error || "讀取訂單失敗"
      );
    }

    const orders =
      result.orders || [];

    const order =
      orders.find(item =>
        String(item.order_number) ===
        String(orderNumber)
      );

    if (!order) {
      content.innerHTML =
        '<div class="error">找不到這筆訂單</div>';
      return;
    }

    content.innerHTML = `

      <div class="order-number">
        訂單編號：${order.order_number || ""}
      </div>

      <div class="section">

        <h2>客戶資料</h2>

        <div class="row">
          <div class="label">姓名</div>
          <div>${order.customer_name || ""}</div>
        </div>

        <div class="row">
          <div class="label">手機</div>
          <div>${order.phone || ""}</div>
        </div>

        <div class="row">
          <div class="label">Email</div>
          <div>${order.email || ""}</div>
        </div>

        <div class="row">
          <div class="label">收件地址</div>
          <div>${order.address || ""}</div>
        </div>

      </div>

      <div class="section">

        <h2>商品資料</h2>

        <div class="items">
          ${renderItems(order.items)}
        </div>

      </div>

      <div class="section">

        <h2>付款與配送</h2>

        <div class="row">
          <div class="label">付款方式</div>
          <div>${order.payment || ""}</div>
        </div>

        <div class="row">
          <div class="label">配送方式</div>
          <div>${order.shipping || ""}</div>
        </div>

        <div class="row">
          <div class="label">訂單狀態</div>
          <div>${order.status || ""}</div>
        </div>

      </div>

      <div class="section">

        <h2>訂單資訊</h2>

        <div class="row">
          <div class="label">備註</div>
          <div>${order.note || "無"}</div>
        </div>

        <div class="row">
          <div class="label">下單時間</div>
          <div>${formatDate(order.created_at)}</div>
        </div>

        <div class="row">
          <div class="label">訂單金額</div>
          <div class="total">
            ${money(order.total)}
          </div>
        </div>

      </div>

    `;

  } catch (error) {

    content.innerHTML =
      '<div class="error">訂單資料讀取失敗</div>';

  }
}

loadOrderDetail();

</script>

</body>
</html>
